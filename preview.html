/* ---- Supabase version additions ---- */
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#login[hidden]{display:none}
#login .box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 8px 35px #243a2a10}
#login .brand-mark{display:block;width:200px;height:62px;margin:0 auto 8px}
#login .field input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;min-height:44px;box-sizing:border-box}
.login-error{color:#b3261e;font-size:12px;min-height:18px;margin:10px 0}
.branch select{max-width:100%;margin-top:3px;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
body.teacher #sidebar,body.teacher #menu-toggle{display:none}
body.teacher .workspace{margin-left:0}

/* holiday events on calendar */
.event.red{background:#fff5f5;color:#c53030;border-left:3px solid #e53e3e;cursor:default;pointer-events:none}
.event.purple{background:#faf5ff;color:#6b46c1;border-left:3px solid #805ad5}
.event.pink{background:#fff5f7;color:#97266d;border-left:3px solid #d53f8c}
/* checkrow group for multi-select */
.checkrow-group{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.badge.red{background:#fff5f5;color:#c53030}

/* week calendar grid */
.week-grid{width:100%;border-collapse:collapse;table-layout:fixed}
.week-grid th,.week-grid td{border:1px solid var(--line);padding:6px;vertical-align:top;min-height:80px;font-size:12px}
.week-grid th{text-align:center;background:var(--card);font-size:11px;font-weight:600}
.week-grid th.today{background:var(--accent);color:#fff}
.week-grid td{background:var(--bg)}
.week-grid .event{display:block;margin-bottom:4px;padding:4px 6px;border-radius:6px;font-size:11px;text-align:left;width:100%;cursor:pointer}

/* kanban board */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}
.kanban-col{min-width:220px;max-width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;flex-shrink:0}
.kanban-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700}
.kanban-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:12px;line-height:1.5}
.kanban-card:active{cursor:grabbing;opacity:.8}
.kanban-card.closed{cursor:default}
.kanban-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.kanban-add{width:100%;margin-top:4px;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px;font-size:12px;color:var(--sub);cursor:pointer}

let db={students:[],leads:[],lessons:[],invoices:[],progress:[],requests:[],announcements:[],attendance:{},extras:{},branchInfo:null,teachers:[],staff:[]};let page='Dashboard',role='Admin view',leadView='board',leadStatusFilter='All',leadPriorityFilter='All',selected=null,profileTab='Overview',month=new Date().getMonth(),year=new Date().getFullYear(),query='',statusFilter='',portalTab='Home',chartTab='Revenue';const save=()=>queueSync();const money=n=>'฿'+Number(n).toLocaleString('en-US');const student=id=>db.students.find(s=>s.id==id)||{id:0,name:'(unknown student)',parent:'',phone:'',email:'',school:'',subject:'',level:'',sessions:0,total:0,coins:0,status:'',note:'',age:'',dob:''};const badge=s=>`<span class="badge ${['Unpaid','Pending','Trial booked'].includes(s)?'amber':s==='Absent'?'red':''}">${esc(s)}</span>`;const av=s=>`<span class="avatar ${s.id%3===0?'gold':s.id%2?'':'blue'}">${esc(s.name.split(' ').map(x=>x[0]).join(''))}</span>`;
const navGroups=[['WORKSPACE',[['Dashboard','home'],['Calendar','calendar'],['Reports','chart']]],['PEOPLE',[['Leads','users'],['Clients','users'],['Students','users'],['Teachers','users'],['Personnel','users']]],['LEARNING',[['Lessons','book'],['Student groups','users'],['Packages','box'],['Attendance','check'],['Student progress','star'],['Make-up requests','clock']]],['OPERATIONS',[['Invoices & payments','file'],['Recurring invoices','clock'],['Teacher payroll','coin'],['Schools & venues','pin'],['Holidays','calendar'],['Export data','file'],['Settings','settings']]]];

function go(p){if(!allowed(p)){toast('You do not have access to that page');return}page=p;query='';statusFilter='';closeNavigation(false);render();window.scrollTo(0,0)}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.to);window.to=setTimeout(()=>$('#toast').style.display='none',3500)}function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${role==='Admin view'?'Academy workspace':role}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${action}</div></div>`}const btn=(t,js,cls='primary')=>`<button class="${cls}" onclick="${js}">${t}</button>`;
function table(headers,rows,empty='No records match your search.'){return `<div class="card"><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map((c,i)=>`<td data-label="${esc(headers[i])}">${c}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div><div class="tablefoot"><span>${rows.length} records</span><span></span></div></div>`}function filter(placeholder,opts=[]){return `<div class="card filters"><input class="search" id="search" placeholder="${placeholder}" value="${esc(query)}" oninput="query=this.value;refreshList()" aria-label="Search records">${opts.length?`<select aria-label="Filter status" onchange="statusFilter=this.value;refreshList()"><option value="">All statuses</option>${opts.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button onclick="query='';statusFilter='';render()">Reset filters</button></div>`}function refreshList(){let pos=$('#search')?.selectionStart;render();if($('#search')){$('#search').focus();$('#search').setSelectionRange(pos,pos)}}function matches(s){return JSON.stringify(s).toLowerCase().includes(query.toLowerCase())&&(!statusFilter||s.status===statusFilter)}
function stats(){const fin=allowed('Invoices & payments');const paid=db.invoices.filter(i=>i.status==='Paid').reduce((n,i)=>n+i.amount,0);const active=db.students.filter(s=>s.status==='Active');const clients=new Set(active.map(s=>(s.parent||'').trim().toLowerCase()).filter(Boolean)).size;const upcoming=db.lessons.filter(l=>l.date>=todayStr()).length;const remaining=active.reduce((n,s)=>n+Math.max(0,s.sessions),0);return `<div class="stats">${[['Students',active.length,'Active learners','users'],['Upcoming lessons',upcoming,'From today onwards','book'],fin?['Revenue collected',money(paid),'Paid invoices','coin']:['Sessions remaining',remaining,'Across active students','coin'],['Active clients',clients,'Families with an active student','users']].map(([n,v,t,i])=>`<div class="card stat">${icon(i)}<small>${n}</small><strong>${v}</strong><em>${t}</em></div>`).join('')}</div>`}
function chart(){const fin=allowed('Invoices & payments');if(!fin&&chartTab==='Revenue')chartTab='Students';const rev=chartTab==='Revenue';const groups=subjects.map(sub=>{const inv=db.invoices.filter(i=>i.subject===sub);return{sub,a:rev?inv.reduce((n,i)=>n+i.amount,0):db.students.filter(s=>s.subject===sub&&s.status==='Active').length,b:rev?inv.filter(i=>i.status==='Paid').reduce((n,i)=>n+i.amount,0):0}});const max=Math.max(1,...groups.map(g=>g.a));const lab=v=>rev?money(v):v;return `<div class="card pad"><div class="cardhead"><div><h2>By programme</h2><p>${rev?'Invoiced vs collected':'Active students'}</p></div><div class="pill">${(fin?['Revenue','Students']:['Students']).map(x=>`<button class="${chartTab===x?'active':''}" onclick="chartTab='${x}';render()">${x}</button>`).join('')}</div></div><div class="chart">${groups.map(g=>`<div class="bar-group"><div class="bar" style="height:${100*g.a/max}%" title="${esc(g.sub)}: ${lab(g.a)}"></div>${rev?`<div class="bar alt" style="height:${100*g.b/max}%" title="Collected ${money(g.b)}"></div>`:''}<small>${esc(g.sub)}</small></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>${rev?'Invoiced':'Active students'}</span>${rev?'<span><i class="dot b"></i>Collected</span>':''}</div></div>`}
function dashboard(){return head('A little progress. Big possibilities.',longDate(),btn('+ Schedule lesson',"lessonForm()"))+`<div class="welcome"><div><h2>Welcome back, ${esc(firstName())}.</h2><p>A thoughtful space to keep your academy moving.</p></div><div class="welcome-art"><i></i><i></i><i></i></div></div>`+stats()+`<div class="grid2">${chart()}<div class="card pad"><div class="cardhead"><h2>Needs your attention</h2><span class="badge amber">To do</span></div>${[[db.invoices.filter(i=>i.status==='Unpaid').length,'Unpaid invoices','Review balances and record payments','Invoices & payments'],[db.requests.filter(r=>r.status==='Pending').length,'Make-up requests','Find a new time to keep learning','Make-up requests'],[db.leads.length,'Families to follow up','Turn curiosity into a first class','Leads']].filter(x=>allowed(x[3])).map(([n,t,s,p])=>`<div class="todo" onclick="go('${p}')"><span class="n">${n}</span><div><strong>${t}</strong><small>${s}</small></div><span class="arrow">↗</span></div>`).join('')}</div></div><div class="card pad"><div class="cardhead"><div><h2>Today in the studio</h2><p>Make room for their next big idea.</p></div>${btn('View calendar →',"go('Calendar')",'link')}</div>${lessonTable(db.lessons.filter(l=>l.date===todayStr()))}</div>`}

function openProfile(id){selected=id;page='Student profile';profileTab='Overview';render()}function profile(){const s=student(selected);return head(s.name,'Student profile · Explore their learning journey',btn('← Students',"go('Students')",'')+btn('Edit profile',`studentForm(${s.id})`)+btn('Convert to lead',`studentToLead(${s.id})`,''))+`<div class="profilegrid"><div class="card pad profilecard"><div class="avatar profilephoto">${esc(s.name.split(' ').map(n=>n[0]).join(''))}</div><h2>${esc(s.name)}</h2><p class="sub">${s.age} years · ${esc(s.level)}</p><p>${badge(s.status)}</p><div class="coin"><div><small>ARCKO COINS</small><br><b>${s.coins} ✦</b></div>${btn('+ 1',`addCoin(${s.id})`,'small')}</div><div class="details"><div><small>PARENT / CLIENT</small><p>${esc(s.parent)}</p></div><div><small>CONTACT</small><p>${esc(s.phone)}<br>${esc(s.email)}</p></div><div><small>SCHOOL</small><p>${esc(s.school)}</p></div><div><small>BIRTHDAY</small><p>${esc(s.dob)}</p></div></div></div><div><div class="tabs">${['Overview','Enrolments','Attendance','Progress',...(allowed('Invoices & payments')?['Invoices']:[]),'Notes'].map(t=>`<button class="${profileTab===t?'active':''}" onclick="profileTab='${t}';render()">${t}</button>`).join('')}</div>${profileContent(s)}</div></div>`}

function addCoin(id){student(id).coins++;save();render();toast('1 Arcko coin added')}function modal(title,sub,body,onSubmit){$('#modal').innerHTML=`<button class="close" onclick="closeModal()" aria-label="Close">×</button><h2>${title}</h2><p class="sub">${sub}</p><form id="modalform">${body}<div class="formfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>`;$('#modalform').onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(e.target)));};$('#modal').showModal()}function closeModal(){$('#modal').close()}const field=(label,name,value='',type='text',required=true)=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;const sel=(label,name,options,value,req,onchange)=>`<label class="field">${label}<select name="${name}" ${onchange?`onchange="${onchange}"`:''}>${options.map(o=>`<option value="${esc(typeof o==='object'?o.id:o)}" ${String(typeof o==='object'?o.id:o)===String(value)?'selected':''}>${esc(typeof o==='object'?o.name:o)}</option>`).join('')}</select></label>`;const subjects=['3D Printing','Tech Toy Design','Digital Arts','Animation & Manga','Chess','Finance for Fun','Robotics','Coding','Other'];const textfield=(label,name,value='')=>`<label class="field full">${label}<textarea name="${name}">${esc(value)}</textarea></label>`;

function leadKanban(){
  const cols=['New inquiry','Trial booked','Contacted','Follow up','Not interested'];
  const closed=db.leads.filter(l=>l.status==='Closed lost');
  let html='<div class="kanban">';
  cols.forEach(col=>{
    const cards=db.leads.filter(l=>l.status===col&&matches(l));
    html+='<div class="kanban-col" ondragover="event.preventDefault()" ondrop="leadDrop(event,\''+col+'\')"><div class="kanban-head"><b>'+esc(col)+'</b><span class="badge">'+cards.length+'</span></div>';
    cards.forEach(l=>{
      const subs=(l.subjects&&l.subjects.length?l.subjects:[l.subject||'']).filter(Boolean);
      html+='<div class="kanban-card" draggable="true" ondragstart="window._dragLead='+l.id+'">'
        +'<b>'+esc(l.name)+'</b><br><small>'+esc(l.child||'')+(l.age?' · '+l.age+' yrs':'')+'</small><br>'
        +subs.map(x=>'<span class="badge">'+esc(x)+'</span>').join(' ')
        +(l.priority?'<span class="badge '+(l.priority==='High'?'red':l.priority==='Low'?'':'amber')+'" style="margin-left:4px">'+esc(l.priority)+'</span>':'')
        +'<div class="kanban-actions">'
        +`<label class="field">Move to<select aria-label="Move lead" onchange="moveLead(${l.id},this.value)">${[...cols,'Closed lost'].map(st=>`<option ${st===l.status?'selected':''}>${esc(st)}</option>`).join('')}</select></label>`
        +btn('Edit','leadEdit('+l.id+')','small')
        +(col==='Trial booked'?btn('+ Trial class','leadTrialClass('+l.id+')','small'):'')
        +btn('→ Client','convertLead('+l.id+')','small')
        +btn('Close','closeLead('+l.id+')','small')
        +'</div></div>';
    });
    html+=btn('+ Add lead','leadForm()','kanban-add')+'</div>';
  });
  html+='</div>';
  if(closed.length){
    html+='<div class="sectiongap" style="margin-top:20px"><h3 style="color:var(--sub);font-size:13px">CLOSED LOST ('+closed.length+')</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';
    closed.forEach(l=>{html+='<div class="kanban-card" style="opacity:.6"><b>'+esc(l.name)+'</b><br><small>'+esc(l.child||'')+'</small><br>'+btn('Reopen','reopenLead('+l.id+')','small')+'</div>';});
    html+='</div></div>';
  }
  return html;
}

function moveLead(id,status){const l=db.leads.find(x=>x.id===id);if(l){l.status=status;save();render()}}
function leadDrop(e,status){
  e.preventDefault();
  const id=window._dragLead; if(!id)return;
  const l=db.leads.find(l=>l.id===id); if(!l)return;
  l.status=status; save(); render(); window._dragLead=null;
}
function closeLead(id){
  const l=db.leads.find(l=>l.id===id); if(!l)return;
  l.status='Closed lost'; save(); render(); toast('Lead moved to Closed lost');
}
function reopenLead(id){
  const l=db.leads.find(l=>l.id===id); if(!l)return;
  l.status='Follow up'; save(); render(); toast('Lead reopened');
}
function leadTrialClass(id){
  const l=db.leads.find(l=>l.id===id); if(!l)return;
  const subs=l.subjects&&l.subjects.length?l.subjects:[l.subject].filter(Boolean);
  const upcoming=db.lessons.filter(x=>x.date>=todayStr()&&(subs.length===0||subs.includes(x.subject)));
  if(!upcoming.length){toast('No upcoming lessons match this lead\'s subjects. Schedule one first.');return;}
  modal('Add to trial class','Choose a lesson for '+(l.child||l.name)+' to trial as a guest.',
    `<div class="formgrid"><label class="field full">Lesson<select name="lesson_id">${upcoming.map(x=>`<option value="${x.id}">${x.date} ${x.time} · ${esc(x.subject)} · ${esc(x.teacher)}</option>`).join('')}</select></label></div>`,
    v=>{
      const les=db.lessons.find(x=>x.id===+v.lesson_id); if(!les)return;
      les.trials ||= [];
      if(les.trials.some(t=>t.leadId===id))return toast('This lead is already booked in this class');
      if(classSize(les)>=8)return toast('This class is full (max 8 students)');
      if(db.lessons.some(x=>x.id!==les.id&&x.date===les.date&&x.time===les.time&&(x.trials||[]).some(t=>t.leadId===id)))return toast('This lead already has a trial at that time');
      les.trials.push({leadId:id,name:l.child||l.name,status:'Not marked'});
      save();closeModal();render();toast((l.child||l.name)+' added as trial guest to '+les.date+' '+les.time);
    });
}

','status',['New inquiry','Trial booked','Contacted','Follow up','Not interested','Closed lost'],l.status)}${textfield('Notes','note',l.note||'')}</div>`,v=>{const extraSubs=subjects.filter(sub=>v['sub_'+sub.replace(/\s+/g,'_')]);const allSubs=[...new Set([v.subject,...extraSubs])].filter(Boolean);Object.assign(l,{...v,age:+v.age,subjects:allSubs,note:v.note||'',source:v.source||'',priority:v.priority||'Medium'});save();closeModal();render();toast('Lead updated')})}
function leadLinks(){return db.extras['Lead links'] ||= []}
function linkedStudent(l){const link=leadLinks().find(x=>Number(x.name)===l.id);if(link)return db.students.find(s=>s.id===Number(link.details));const candidates=db.students.filter(s=>s.status==='Archived'&&s.name===l.child&&s.parent===l.name&&s.phone===l.phone&&l.note?.startsWith('Converted back from student.'));return candidates.length===1?candidates[0]:null}

function studentToLead(id){

/* Arcko Academy Studio · data layer (Supabase)
   Loaded after app.js. app.js keeps the screens; this file handles login, roles,
   loading data, saving changes and CSV export. Security is NOT enforced here: the
   database refuses anything a role is not allowed to do (see supabase/schema.sql).
   The checks below only decide which buttons and pages to show. */

const CFG = window.ARCKO_CONFIG || {};
const PAY_RATE = 600;                       // THB per lesson, used on the Teacher payroll page
let sb = null, me = null, activeBranch = null, branches = [], loaded = false;
let snap = null, pending = 0, syncChain = Promise.resolve(), syncFailed = false;

/* ---------- small helpers used by app.js ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayStr = () => ymd(new Date());
const datePlus = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d) };
const longDate = () => new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const firstName = () => (me?.name || '').split(' ')[0] || 'there';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const teacherOptions = () => [{ id: '', name: 'Unassigned' }, ...db.teachers.map(t => ({ id: t.id, name: t.name }))];
const teacherName = id => id ? (db.teachers.find(t => t.id === id)?.name || 'Teacher') : 'Unassigned';
const branchName = () => db.branchInfo?.name || '';
const branchForWrite = () => me.role === 'owner' ? activeBranch : me.branch_id;

/* ---------- roles: which pages each role can open ---------- */
const FINANCE_PAGES = ['Invoices & payments', 'Recurring invoices', 'Teacher payroll'];
const ADMIN_BLOCKED = [...FINANCE_PAGES, 'Personnel', 'Settings'];
function allowed(p) {
  if (!me) return false;
  if (me.role === 'owner' || me.role === 'manager') return true;
  if (me.role === 'admin') return !ADMIN_BLOCKED.includes(p);
  return false;                              // teachers only use the classroom view
}
function visibleNav() {

}

/* ---------- start-up ---------- */
async function startApp(user) {
  $('#login').hidden = true;
  const { data: p, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !p) { showBlocked(error ? 'Could not load your account: ' + error.message : 'Your account has no role yet. Ask the academy owner to finish setting it up.'); return }
  me = { id: p.id, name: p.full_name, role: p.role, branch_id: p.branch_id };
  role = me.role === 'teacher' ? 'Teacher view' : 'Admin view';
  const { data: bs, error: be } = await sb.from('branches').select('*').order('id');
  if (be || !bs?.length) { showBlocked('No branch is available for your account yet. Ask the academy owner.'); return }
  branches = bs;
  const saved = +localStorage.getItem('arcko-branch');
  activeBranch = me.role === 'owner' ? (bs.some(b => b.id === saved) ? saved : bs[0].id) : me.branch_id;
  page = 'Dashboard'; portalTab = 'Home';
  try { await loadAll() } catch (e) { showBlocked('Could not load data: ' + (e.message || e)); return }
  render();
}
async function boot() {
  if (!window.supabase) { showBlocked('The Supabase library could not be loaded. Check your internet connection and reload.', false); return }
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || /YOUR/i.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY)) {
    showBlocked('Supabase is not connected yet. Open config.js and paste your project URL and anon key.', false); return
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && loaded) location.reload() });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return }
  await startApp(session.user);
}

/* ---------- loading ---------- */
const ORDER = ['students', 'student_contacts', 'leads', 'lessons', 'lesson_students', 'attendance', 'invoices', 'progress', 'requests', 'announcements', 'extras'];
const ORD = { students: ['id'], student_contacts: ['student_id'], leads: ['id'], lessons: ['id'], lesson_students: ['lesson_id', 'student_id'], attendance: ['lesson_id', 'student_id'], invoices: ['id'], progress: ['id'], requests: ['id'], announcements: ['id'], extras: ['id'], profiles: ['created_at', 'id'] };
const PK = { branches: ['id'], students: ['id'], student_contacts: ['student_id'], leads: ['id'], lessons: ['id'], lesson_students: ['lesson_id', 'student_id'], attendance: ['lesson_id', 'student_id'], invoices: ['id'], progress: ['id'], requests: ['id'], announcements: ['id'], extras: ['id'] };
// Tables each role can read at all (skips pointless requests; the database enforces the real rule).
const READ = {
  admin: ['students', 'student_contacts', 'leads', 'lessons', 'lesson_students', 'attendance', 'progress', 'requests', 'announcements', 'extras'],
  teacher: ['students', 'lessons', 'lesson_students', 'attendance', 'progress', 'announcements']
};

async function fetchAll(t, filter) {             // Supabase returns at most 1000 rows per request
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(t).select('*');
    if (filter) q = filter(q);
    ORD[t].forEach(c => { q = q.order(c) });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function loadAll() {
  const tables = READ[me.role] || ORDER;
  const ownerOnly = me.role === 'owner' ? (q => q.eq('branch_id', activeBranch)) : null;
  const get = t => tables.includes(t) ? fetchAll(t, ownerOnly) : Promise.resolve([]);
  const [stu, con, lea, les, ls, att, inv, pro, req, ann, ext] = await Promise.all(ORDER.map(get));
  const prof = await fetchAll('profiles', ownerOnly);
  const { data: bs, error: be } = await sb.from('branches').select('*').order('id');
  if (be) throw be;
  branches = bs;

  const d = { students: [], leads: [], lessons: [], invoices: [], progress: [], requests: [], announcements: [], attendance: {}, extras: {}, branchInfo: null, teachers: [], staff: [] };
  d.branchInfo = bs.find(b => b.id == activeBranch) || null;
  d.teachers = prof.filter(p => p.role === 'teacher').map(p => ({ id: p.id, name: p.full_name }));
  const staff = new Map();
  if (me.role === 'owner') staff.set(me.id, { id: me.id, name: me.name, role: 'owner' });
  prof.filter(p => p.role !== 'teacher').forEach(p => staff.set(p.id, { id: p.id, name: p.full_name, role: p.role }));
  d.staff = [...staff.values()];

  const contacts = new Map(con.map(c => [c.student_id, c]));
  d.students = stu.map(s => { const c = contacts.get(s.id) || {}; return { id: s.id, name: s.name, age: s.age ?? '', dob: s.dob || '', school: s.school || '', subject: s.subject, level: s.level, total: s.total, sessions: s.total - s.sessions_used, coins: s.coins, status: s.status, note: s.note || '', parent: c.parent || '', phone: c.phone || '', email: c.email || '' } });
  d.leads = lea.map(l => ({ id: l.id, name: l.name, child: l.child || '', age: l.age ?? '', subject: l.subject || '', subjects: l.subjects || (l.subject ? [l.subject] : []), phone: l.phone || '', status: l.status, note: l.note || '', source: l.source || '', priority: l.priority || 'Medium' }));
  const roster = {}; ls.forEach(r => (roster[r.lesson_id] ??= []).push(r.student_id));
  d.lessons = les.map(l => ({ id: l.id, subject: l.subject, title: l.title, date: l.date, time: l.time, teacher_id: l.teacher_id, teacher: l.teacher_id ? (d.teachers.find(t => t.id === l.teacher_id)?.name || 'Teacher') : 'Unassigned', room: l.room || '', ids: roster[l.id] || [], trials: l.trial_guests || [] }))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  att.forEach(a => { d.attendance[a.lesson_id + '-' + a.student_id] = a.status });
  d.invoices = inv.map(i => ({ id: i.id, student: i.student_id, subject: i.subject, amount: Number(i.amount), status: i.status, date: i.date, due: i.due, method: i.method || '' }));
  d.progress = pro.map(p => ({ id: p.id, student: p.student_id, subject: p.subject || '', date: p.date, title: p.title, text: p.body, author: p.author || '' }))
    .sort((a, b) => (b.date + String(b.id).padStart(16, '0')).localeCompare(a.date + String(a.id).padStart(16, '0')));
  d.requests = req.map(r => ({ id: r.id, student: r.student_id, date: r.date, time: r.time, reason: r.reason || '', status: r.status }));
  d.announcements = ann.map(a => ({ id: a.id, title: a.title, text: a.body || '', date: a.date })).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  ext.forEach(x => (d.extras[x.type] ??= []).push({ id: x.id, name: x.name, date: x.date || '', details: x.details || '' }));

  db = d; snap = rowsOf(db); loaded = true;
}

/* ---------- saving ----------
   app.js changes `db` directly and calls save(). We compare `db` with the last copy
   we saved, then send only the differences to Supabase, in order. If anything is
   refused, the screen reloads from the database so it never shows unsaved data. */
const num = v => v === '' || v == null ? null : Number(v);
function rowsOf(d) {
  const R = { branches: {} }; ORDER.forEach(t => R[t] = {});
  if (d.branchInfo) R.branches[d.branchInfo.id] = { id: d.branchInfo.id, name: d.branchInfo.name, email: d.branchInfo.email || null };
  d.students.forEach(s => {
    R.students[s.id] = { id: s.id, name: s.name, age: num(s.age), dob: s.dob || null, school: s.school || null, subject: s.subject, level: s.level, total: +s.total || 0, coins: +s.coins || 0, status: s.status, note: s.note || null };
    R.student_contacts[s.id] = { student_id: s.id, parent: s.parent || null, phone: s.phone || null, email: s.email || null };
  });
  d.leads.forEach(l => R.leads[l.id] = { id: l.id, name: l.name, child: l.child || null, age: num(l.age), subject: l.subject || null, subjects: l.subjects || null, phone: l.phone || null, status: l.status, note: l.note || null, source: l.source || null, priority: l.priority || 'Medium' });
  d.lessons.forEach(l => {
    R.lessons[l.id] = { id: l.id, subject: l.subject, title: l.title, date: l.date, time: l.time, teacher_id: l.teacher_id || null, room: l.room || null, trial_guests: l.trials || [] };
    (l.ids || []).forEach(sid => R.lesson_students[l.id + '-' + sid] = { lesson_id: l.id, student_id: sid });
  });
  Object.entries(d.attendance).forEach(([k, st]) => {
    if (!['Present', 'Absent', 'Excused'].includes(st) || !R.lesson_students[k]) return;   // "Not marked" = no row
    const [lid, sid] = k.split('-'); R.attendance[k] = { lesson_id: +lid, student_id: +sid, status: st };
  });
  d.invoices.forEach(i => R.invoices[i.id] = { id: i.id, student_id: i.student, subject: i.subject, amount: +i.amount, status: i.status, date: i.date, due: i.due, method: i.method || null });
  d.progress.forEach(p => R.progress[p.id] = { id: p.id, student_id: p.student, subject: p.subject || null, date: p.date, title: p.title, body: p.text, author: p.author || null });
  d.requests.forEach(r => R.requests[r.id] = { id: r.id, student_id: r.student, date: r.date, time: r.time, reason: r.reason || null, status: r.status });
  d.announcements.forEach(a => R.announcements[a.id] = { id: a.id, title: a.title, body: a.text || null, date: a.date });
  Object.entries(d.extras).forEach(([type, arr]) => arr.forEach(x => R.extras[x.id] = { id: x.id, type, name: x.name, date: x.date || null, details: x.details || null }));
  return R;
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function diffRows(prev, cur) {
  const ops = [];
  for (const t of ['branches', ...ORDER]) {
    const p = prev[t] || {}, c = cur[t] || {};
    for (const k in c) {
      if (!(k in p)) { if (t !== 'branches') ops.push({ t, op: 'insert', row: c[k] }); continue }
      const patch = {};
      for (const f in c[k]) if (!same(c[k][f], p[k][f])) patch[f] = c[k][f];
      if (Object.keys(patch).length) ops.push({ t, op: 'update', row: c[k], patch });
    }
    if (t !== 'branches') for (const k in p) if (!(k in c)) ops.push({ t, op: 'delete', row: p[k] });
  }
  return ops;
}

async function applyOps(ops) {
  const bid = branchForWrite();
  for (const t of ORDER) {                                     // 1. inserts, parents before children
    const rows = ops.filter(o => o.t === t && o.op === 'insert').map(o => {
      const r = { ...o.row, branch_id: bid };
      if (t === 'invoices') delete r.id;                       // invoice numbers come from the database
      return r;
    });
    if (rows.length) { const { error } = await sb.from(t).insert(rows); if (error) throw error }
  }
  for (const o of ops.filter(o => o.op === 'update')) {        // 2. updates (changed fields only)
    if (o.t === 'student_contacts') {
      const { error } = await sb.from(o.t).upsert({ ...o.row, branch_id: bid }, { onConflict: 'student_id' });
      if (error) throw error; continue;
    }
    let q = sb.from(o.t).update(o.patch);
    PK[o.t].forEach(k => { q = q.eq(k, o.row[k]) });
    const { data, error } = await q.select(PK[o.t][0]);
    if (error) throw error;
    if (!data.length) throw new Error('NOT_PERMITTED');        // blocked rows update silently, so check
  }
  for (const t of [...ORDER].reverse()) {                      // 3. deletes, children before parents
    for (const o of ops.filter(o => o.t === t && o.op === 'delete')) {
      let q = sb.from(t).delete();
      PK[t].forEach(k => { q = q.eq(k, o.row[k]) });
      const { data, error } = await q.select(PK[t][0]);
      if (error) throw error;
      if (!data.length) throw new Error('NOT_PERMITTED');
    }
  }
}

function friendly(e) {
  const m = String(e && e.message || e);
  if (m.includes('No sessions remaining')) return 'No sessions remaining. Add a package first.';
  if (m === 'NOT_PERMITTED' || /row-level security|permission denied/i.test(m)) return 'You do not have permission to make that change.';
  if (/foreign key/i.test(m)) return 'That change conflicts with other records.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection. Your change was not saved.';
  return 'Could not save: ' + m;
}

async function runJob() {
  try { if (!syncFailed) { const cur = rowsOf(db); await applyOps(diffRows(snap, cur)); snap = cur } }
  catch (e) { syncFailed = true; console.error(e); toast(friendly(e)) }
  pending--;
  if (pending === 0) {
    syncFailed = false;
    try { await loadAll() } catch (e) { console.error(e); toast('Could not refresh data'); return }
    render();
  }
}
function queueSync() { if (!loaded) return; pending++; syncChain = syncChain.then(runJob) }

/* ---------- CSV export (built from what this user is allowed to see) ---------- */
function csvCell(v) {
  if (v === null || v === undefined) return '';
  let s = String(v);
  // Stop spreadsheet formula injection, but keep phone numbers and amounts intact.
  const numeric = /^[+\-]?[\d\s().\-]+$/.test(s);
  if (/^[=@\t\r]/.test(s) || (/^[+\-]/.test(s) && !numeric)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }));   // BOM keeps Thai text intact in Excel
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

};
async function exportData(kind) {
  const x = EXPORTS[kind];
  if (!x || !allowed('Export data') || (x.fin && !allowed('Invoices & payments'))) { toast('You do not have access to that export'); return }

  const slug = (branchName() || 'branch').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  downloadCsv(`arcko-${slug}-${kind}-${todayStr()}.csv`, x.rows());
  toast(x.label + ' CSV downloaded');
}
function exportPage() {
  const items = Object.entries(EXPORTS).filter(([, x]) => !x.fin || allowed('Invoices & payments'));

}
